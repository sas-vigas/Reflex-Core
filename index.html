<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reflex Core</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <header class="top-bar">

            <div class="title">
                <span class="dot"></span>
                NEON AIM
            </div>

            <div class="stats">

                <div class="stat">
                    <span>TIME</span>
                    <strong id="time">3.00</strong>
                </div>

                <div class="stat">
                    <span>SCORE</span>
                    <strong id="score">0</strong>
                </div>

            </div>

        </header>


        <main class="board" id="board">

            <div class="start-message" id="startMessage">
                <h1>NEON AIM</h1>
                <p>Click the circle before time runs out</p>

                <button id="startButton">
                    START GAME
                </button>
            </div>


            <div class="target" id="target">

                <div class="target-ring"></div>

                <div class="target-core"></div>

            </div>


            <div class="game-over" id="gameOver">

                <div class="game-over-box">

                    <span class="over-label">GAME OVER</span>

                    <h2 id="finalScore">0</h2>

                    <p>FINAL SCORE</p>

                    <button id="restartButton">
                        RESTART
                    </button>

                </div>

            </div>

        </main>


        <footer>
            <span>HIT THE TARGET</span>
            <span>•</span>
            <span>DON'T MISS</span>
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
